<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="VS Lens Mart logo, concept 4: heritage badge, with name">
  <!-- Logo concept draft for the client to choose from. Not approved. Convert the text to outlines before final use. -->
  <defs><path id="lc4-top" d="M15 60 A45 45 0 0 1 105 60"/><path id="lc4-bot" d="M8 60 A52 52 0 0 0 112 60"/></defs>
  <circle cx="60" cy="60" r="57" fill="#0D1B2A" stroke="#C9A227" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="1.2" fill="#F5C842"><textPath href="#lc4-top" startOffset="50%" text-anchor="middle">VS LENS MART</textPath></text>
  <text font-family="Inter, Arial, sans-serif" font-weight="600" font-size="6.4" letter-spacing="0.6" fill="#C9A227"><textPath href="#lc4-bot" startOffset="50%" text-anchor="middle">CARE · LOVE · QUALITY · FAMILY</textPath></text>
  <circle cx="10" cy="60" r="1.8" fill="#F5C842"/><circle cx="110" cy="60" r="1.8" fill="#F5C842"/>
  <g fill="none" stroke="#F5C842" stroke-width="2.5" stroke-linecap="round">
    <circle cx="49" cy="58" r="9"/><circle cx="71" cy="58" r="9"/><path d="M57 55 Q60 51 63 55"/>
  </g>
  <text x="60" y="81" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="6.5" letter-spacing="1.5" fill="#C9A227">EST. 1999</text>
  <text x="140" y="66" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="0.5" fill="var(--lg-ink, #0D1B2A)">VS LENS MART</text>
  <text x="141" y="90" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12.5" letter-spacing="4" fill="var(--lg-accent, #C9A227)">SINCE 1999</text>
